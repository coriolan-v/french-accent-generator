[platformio]
default_envs = promicro16
src_dir = arduino/FrenchOMaticButton

[env]
platform = atmelavr@5.1.0
framework = arduino
lib_deps =
    fastled/FastLED@3.9.15
    arduino-libraries/Keyboard@1.0.6

; Select the environment matching the voltage / clock marked on your board.
[env:promicro16]
board = sparkfun_promicro16

[env:promicro8]
board = sparkfun_promicro8
