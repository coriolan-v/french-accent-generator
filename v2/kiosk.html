<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frenchify me</title>
<style>
  :root { --red: #d63a3a; --blue: #1f4fbf; --white: #f4f2ee; --grey: #3a3b44; --hint: #a9a9b6; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  svg { width: 100vmin; height: 100vmin; display: block; }

  .ring { fill: none; stroke-width: 28; }
  .track { stroke: #17171c; }
  #redRing, .flag-red { stroke: var(--red); }
  .flag-white { stroke: var(--white); }
  .flag-blue { stroke: var(--blue); }
  #reveal { fill: none; stroke: #fff; stroke-width: 40; stroke-dasharray: 0 100; }
  #redRing { display: none; }
  [data-state=recording] #redRing { display: inline; }
  #flagRing { opacity: 0; transform-origin: 540px 540px; }
  [data-state=working] #flagRing, [data-state=playing] #flagRing { opacity: 1; }
  [data-state=playing] #reveal { transition: stroke-dasharray .4s ease-out; }
  [data-state=working] #flagRing, [data-state=playing] #flagRing, [data-state=idle] #flagRing { animation: spin 8s linear infinite; }

  /* While processing, a video fills the circle inside the flag ring (inner edge r = 498 of 1080) and
     the title and button step aside. */
  #film { position: fixed; top: 50%; left: 50%; width: 100vmin; height: 100vmin; transform: translate(-50%, -50%);
          object-fit: cover; clip-path: circle(46.1%); opacity: 0; transition: opacity .6s; pointer-events: none; }
  [data-state=working] #film { opacity: 1; }
  svg { position: relative; }
  #titles, #button { transition: opacity .6s; }
  [data-state=working] :is(#titles, #button) { opacity: 0; }
  /* Shown over the video, curved along the bottom inside the ring; the dark outline keeps it readable. */
  #filmText { fill: #fff; font-size: calc(50px * var(--size)); font-weight: var(--weight); text-anchor: middle;
              stroke: rgba(0, 0, 0, .75); stroke-width: 8px; stroke-linejoin: round; paint-order: stroke;
              opacity: 0; transition: opacity .6s; }
  [data-state=working] #filmText { opacity: 1; animation: glow 2s ease-in-out .6s infinite; }
  @keyframes glow { 50% { opacity: .65; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Going idle crossfades: whatever was showing fades out (setState leaves it in place) as the mic fades in.
     The pyramid lights crossfade over the same time (FADE_MS in arduino/PyramidLights). */
  [data-state=idle] :is(#flagRing, #big, #mic, #halo) { transition: opacity 1.5s; }
  [data-state=idle] #face { transition: fill 1.5s; }

  /* The font comes from the operator page (see applyFont). */
  svg { --font: "Segoe UI", system-ui, sans-serif; --size: 1; --hint-size: 1; --weight: 900; --hint-weight: 600;
        font-family: var(--font); font-synthesis: none; }
  .title { fill: #fff; font-size: calc(96px * var(--size)); font-weight: var(--weight); letter-spacing: 8px; text-anchor: middle; }
  /* Two copies of the title, on opposite sides of a circle around the button, turning slowly. */
  #titles { transform-origin: 540px 540px; animation: spin 60s linear infinite; }
  /* The instructions curve along the top of the button, above the mic. */
  .hint { fill: #fff; font-size: calc(34px * var(--hint-size)); font-weight: var(--hint-weight); text-anchor: middle; }

  #button { cursor: pointer; }
  #face { fill: var(--grey); transition: fill .3s; }
  [data-state=idle] #face, [data-state=recording] #face { fill: var(--red); }
  [data-state=working] #face, [data-state=playing] #face { fill: var(--blue); }
  #halo { fill: var(--red); opacity: 0; transform-box: fill-box; transform-origin: center; }
  [data-state=idle] #halo { opacity: .25; animation: breathe 3s ease-in-out infinite; }
  [data-state=recording] #halo { opacity: .3; }
  @keyframes breathe { 50% { transform: scale(1.08); } }
  #mic { opacity: 0; }
  [data-state=idle] #mic { opacity: 1; }
  [data-state=waiting] #mic { opacity: .4; }
  #big { fill: #fff; font-size: calc(88px * var(--size)); font-weight: var(--weight); text-anchor: middle; dominant-baseline: central; }
  [data-state=idle] #big { opacity: 0; }
  [data-state=recording] #big { font-size: calc(240px * var(--size)); }
  [data-state=working] #big { font-size: calc(64px * var(--size)); }
</style>
</head>
<body data-state="waiting">
<video id="film" src="/media/Peter_French_Black_Closeup_2K.mp4" preload="auto" loop playsinline></video>
<!-- Drawn for the 1080 × 1080 round panel: only the circle is visible. -->
<svg viewBox="0 0 1080 1080">
  <defs>
    <!-- Full circle clockwise from the left, so 25% is the top and 75% the bottom. -->
    <path id="titleCircle" d="M 160 540 A 380 380 0 1 1 920 540 A 380 380 0 1 1 160 540"/>
    <!-- Inside the button's edge, from lower left over the top to lower right (240°). -->
    <path id="hintArc" d="M 351.2 649 A 218 218 0 1 1 728.8 649"/>
    <!-- Under the centre from left to right, so the text stands upright along the bottom of the circle. -->
    <path id="filmArc" d="M 85 540 A 455 455 0 0 0 995 540"/>
    <mask id="ringMask">
      <circle id="reveal" cx="540" cy="540" r="512" pathLength="100" transform="rotate(-90 540 540)"/>
    </mask>
  </defs>

  <!-- Progress around the edge: red while recording, the French flag while processing and playing. -->
  <circle class="ring track" cx="540" cy="540" r="512"/>
  <g mask="url(#ringMask)">
    <circle class="ring" id="redRing" cx="540" cy="540" r="512"/>
    <g id="flagRing">
      <circle class="ring flag-white" cx="540" cy="540" r="512"/>
      <path class="ring flag-blue" d="M 540 28 A 512 512 0 0 1 983.4 796"/>
      <path class="ring flag-red" d="M 96.6 796 A 512 512 0 0 1 540 28"/>
    </g>
  </g>

  <text id="filmText"><textPath href="#filmArc" startOffset="50%">Applying French accent to your voice…</textPath></text>

  <g id="titles">
    <text class="title"><textPath href="#titleCircle" startOffset="25%">FRENCHIFY ME</textPath></text>
    <text class="title"><textPath href="#titleCircle" startOffset="75%">FRENCHIFY ME</textPath></text>
  </g>

  <g id="button">
    <circle id="halo" cx="540" cy="540" r="260"/>
    <circle id="face" cx="540" cy="540" r="260"/>
    <!-- A microphone drawn as a fleur-de-lys: the head is the middle petal (the slots show the button
         through), the holder curls out into the side petals, and the stand is the band and the tail. -->
    <g id="mic" transform="translate(540 540)" fill="#fff">
      <path fill-rule="evenodd" d="M 0 -195 C 30 -165 46 -128 46 -88 V -6 A 46 46 0 0 1 -46 -6 V -88 C -46 -128 -30 -165 0 -195 Z
        M -22 -85 H 22 A 5 5 0 0 1 22 -75 H -22 A 5 5 0 0 1 -22 -85 Z
        M -22 -57 H 22 A 5 5 0 0 1 22 -47 H -22 A 5 5 0 0 1 -22 -57 Z
        M -22 -29 H 22 A 5 5 0 0 1 22 -19 H -22 A 5 5 0 0 1 -22 -29 Z"/>
      <path d="M -79 0 A 79 79 0 0 0 79 0 C 79 -66 118 -108 158 -92 C 186 -80 186 -44 160 -14
        C 168 -44 162 -66 146 -72 C 120 -82 97 -54 97 0 A 97 97 0 0 1 -97 0
        C -97 -54 -120 -82 -146 -72 C -162 -66 -168 -44 -160 -14
        C -186 -44 -186 -80 -158 -92 C -118 -108 -79 -66 -79 0 Z"/>
      <rect x="-110" y="92" width="220" height="26" rx="8"/>
      <path d="M -30 118 C -10 130 -4 150 0 182 C 4 150 10 130 30 118 Z"/>
    </g>
    <text id="big" x="540" y="540"></text>
    <text class="hint"><textPath href="#hintArc" startOffset="50%" id="hint"></textPath></text>
  </g>
</svg>

<script src="/common.js"></script>
<script>
const TAP_MS = 1000;   // button released sooner than this: hands-free message instead of hold-to-talk
const MIN_FILM_MS = 5000;  // the processing video plays at least this long, even when the result is ready sooner
const HOLD_MS = 4000;  // "Voilà !" and the flag (on screen and on the pyramid) stay this long after the result has played
const HINTS = {
  waiting: 'Warming up, one moment…',
  idle: 'Press the button and speak English',
  recording: 'Listening… speak English!',
  working: 'Adding the French accent…',
  playing: 'That’s you, with a French accent!',
  cancelled: 'I didn’t hear anything, try again',
  error: 'Something went wrong, try again',
};
const BIG = { working: 'Un moment…', playing: 'Voilà !', cancelled: 'Pardon ?', error: 'Oups !' };
const LIGHT_CODES = { recording: 'R', working: 'W', playing: 'P', cancelled: 'C' };

let state = 'waiting', afterId = 0, downAt = 0;
const rec = new Recorder({ stop: recorded });
const player = new Audio();

function setState(s) {
  clearTimeout(afterId);
  state = s;
  document.body.dataset.state = s;
  $('hint').textContent = HINTS[s];
  playFilm(s === 'working');
  if (s !== 'idle') {   // idle fades out the last text and ring instead (see the CSS)
    $('big').textContent = BIG[s] ?? '';
    setRing(s === 'playing' ? 1 : 0);
  }
  syncLights();
  report();
}
// The processing video starts from the beginning each time and loops until the result is ready.
// With sound if the browser allows it in this window, otherwise muted.
function playFilm(on) {
  const film = $('film');
  if (!on) return film.pause();
  film.currentTime = 0;
  film.muted = false;
  film.play().catch(() => { film.muted = true; film.play().catch(() => {}); });
}
const after = (ms, fn) => { afterId = setTimeout(fn, ms); };
const notice = s => { setState(s); after(s === 'error' ? 4000 : 2500, waitForEngine); };   // cancelled or error
const canStart = () => ['idle', 'playing', 'cancelled', 'error'].includes(state);

// Visitors can start once the engine has loaded its models.
async function waitForEngine() {
  let r = null;
  try { r = await (await fetch('/api/health')).json(); } catch {}
  if (!['waiting', 'cancelled', 'error'].includes(state)) return;   // a visitor got going meanwhile
  if (r?.ready) return setState('idle');
  setState('waiting');
  after(2000, waitForEngine);
}

// ---------- Button ----------
// The Pro Micro holds F13 while its button is pressed. Hold it while speaking, or tap it for a
// hands-free message and tap again to finish early. Tapping the screen works like a tap.
function buttonDown() {
  if (rec.active) { rec.stop(); return; }
  if (!canStart()) return;
  rec.held = true;
  downAt = performance.now();
  startRecording();
}
function buttonUp() {
  if (!rec.held) return;
  rec.held = false;
  if (performance.now() - downAt >= TAP_MS) rec.stop();   // held while speaking
}
document.addEventListener('keydown', e => {
  if (e.code !== 'F13') return;
  e.preventDefault();
  if (!e.repeat) buttonDown();
});
document.addEventListener('keyup', e => {
  if (e.code !== 'F13') return;
  e.preventDefault();
  buttonUp();
});
$('button').onclick = () => rec.active ? rec.stop() : canStart() && startRecording();

// Full screen needs a click or key press in this window; the same press also lets it play sound.
// After Escape, the next press goes back to full screen.
for (const type of ['pointerdown', 'keydown']) {
  addEventListener(type, () => document.fullscreenElement || document.documentElement.requestFullscreen().catch(() => {}));
}

// ---------- Visitor run ----------
async function startRecording() {
  player.pause();
  try {
    if (!(await rec.start())) return;
  } catch (e) {
    log('Microphone unavailable: ' + e.message);
    return notice('error');
  }
  voice = 0;
  setState('recording');
}

async function recorded(blob) {
  if (!blob) return notice('cancelled');
  setState('working');
  const t0 = performance.now();
  workStart = t0;
  workExpected = Math.max(1, ratio * rec.elapsed) * 1000;
  let input = null, seconds = 0;
  try {
    ({ wav: input, seconds } = await toWav(blob));
    const r = await convert(input);
    const total = (performance.now() - t0) / 1000;
    learn(total / seconds);
    channel.postMessage({ type: 'run', input, seconds, result: r, total });
    // A quick result waits until the video has played at least MIN_FILM_MS.
    await new Promise(done => setTimeout(done, MIN_FILM_MS - (performance.now() - t0)));
    play(b64Blob(r.audio));
  } catch (e) {
    channel.postMessage({ type: 'run', input, seconds, error: e.message });
    notice(e.status === 422 ? 'cancelled' : 'error');   // 422: no speech or no words heard
  }
}

function play(blob) {
  URL.revokeObjectURL(player.src);
  player.src = URL.createObjectURL(blob);
  setState('playing');
  player.play().catch(() => {
    // The browser blocks sound in a window nobody has clicked or typed in yet, so the operator page
    // plays it. This window can still read the length, to go back to idle when it would have ended.
    channel.postMessage({ type: 'play' });
    const done = () => state === 'playing' && after(player.duration * 1000 + HOLD_MS, () => setState('idle'));
    isNaN(player.duration) ? player.addEventListener('loadedmetadata', done, { once: true }) : done();
  });
}
player.onended = () => state === 'playing' && after(HOLD_MS, () => setState('idle'));

// ---------- Progress ring ----------
// The engine reports no progress, so the ring follows an estimate learnt from earlier runs
// (seconds of processing per second of speech). Past the estimate it slows down instead of stopping.
let ratio = +(localStorage.getItem('workRatio') || 0.25), workStart = 0, workExpected = 1000, voice = 0;
function learn(r) {
  ratio = 0.7 * ratio + 0.3 * r;
  try { localStorage.setItem('workRatio', ratio); } catch {}
}
function setRing(p) { $('reveal').style.strokeDasharray = `${Math.min(p, 1) * 100} ${p >= 1 ? 0 : 100}`; }

function animate() {
  if (state === 'recording') {
    setRing(rec.elapsed / MAX_SECONDS);
    $('big').textContent = Math.ceil(MAX_SECONDS - rec.elapsed);
    voice = Math.max(Math.min(1, Math.max(0, (rec.level + 60) / 45)), voice * 0.9);   // -60..-15 dBFS
    $('halo').style.transform = `scale(${1 + 0.2 * voice})`;
  } else {
    $('halo').style.transform = '';
    if (state === 'working') {
      const t = (performance.now() - workStart) / workExpected;
      setRing(t < 1 ? 0.9 * t : 0.99 - 0.09 * Math.exp(1 - t));
    }
  }
  requestAnimationFrame(animate);
}

// ---------- Pyramid lights ----------
// The Pro Micro shows the state on its LEDs. This page sends one letter per change over USB serial:
// I idle, R recording, W working, P playing the result (the flag), C cancelled (no speech), and
// the flag layout. The operator page asks once which port to allow; this page then connects by itself.
let lightsPort = null, lightsWriter = null;

function sendLights(text) { lightsWriter?.write(new TextEncoder().encode(text)).catch(() => {}); }
function syncLights() { sendLights(LIGHT_CODES[state] ?? 'I'); }
function sendFlag(layout = setting('flagLayout'), shift = setting('flagShift')) { sendLights(flagCommand(layout, shift)); }
async function connectLights(port) {
  if (lightsWriter || port.getInfo().usbVendorId !== LIGHTS_VENDOR) return;
  try {
    await port.open({ baudRate: 115200 });
    await port.setSignals({ dataTerminalReady: true });   // without it the board only follows the button
    lightsPort = port;
    lightsWriter = port.writable.getWriter();
    sendFlag();
    syncLights();
    report();
  } catch (e) {
    log('Could not connect the pyramid lights: ' + e.message);
  }
}
function findLights() {
  navigator.serial?.getPorts().then(ports => {
    const port = ports.find(p => p.getInfo().usbVendorId === LIGHTS_VENDOR);
    if (port) connectLights(port);
  });
}
if ('serial' in navigator) {
  navigator.serial.addEventListener('connect', e => connectLights(e.target));   // board plugged back in
  navigator.serial.addEventListener('disconnect', e => {
    if (e.target !== lightsPort) return;
    lightsWriter?.releaseLock();
    lightsWriter = null;
    lightsPort.close().catch(() => {});
    report();
  });
}

// ---------- Font ----------
// Chosen on the operator page; a font file only downloads once it is used.
for (const [name, f] of Object.entries(DISPLAY_FONTS)) {
  if (f.file) document.fonts.add(new FontFace(name, `url(/fonts/${f.file})`));
}
function applyFont() {
  const name = DISPLAY_FONTS[setting('kioskFont')] ? setting('kioskFont') : DEFAULTS.kioskFont, f = DISPLAY_FONTS[name];
  const s = document.querySelector('svg').style;
  s.setProperty('--font', f.family ?? `"${name}"`);
  s.setProperty('--size', f.size);
  s.setProperty('--hint-size', f.hintSize ?? f.size);
  s.setProperty('--weight', f.weight ?? 400);
  s.setProperty('--hint-weight', f.hint ?? 400);
}
addEventListener('storage', e => e.key === 'kioskFont' && applyFont());   // changed on the operator page
applyFont();

// ---------- Operator page ----------
function report() { channel.postMessage({ type: 'kiosk', state, lights: !!lightsWriter }); }
function log(message) { channel.postMessage({ type: 'log', message }); }
channel.onmessage = ({ data: m }) => {
  if (m.type === 'button') m.down ? buttonDown() : buttonUp();
  else if (m.type === 'lights') { findLights(); sendFlag(m.flagLayout, m.flagShift); }
  else if (m.type === 'lightsPreview') m.code ? sendLights(m.code) : syncLights();   // '' is back to live
  else if (m.type === 'hello') report();
};
setInterval(report, 2000);
addEventListener('pagehide', () => channel.postMessage({ type: 'kiosk', state: 'closed' }));

window.focus();   // take the keyboard, so the button's F13 lands here
setState('waiting');
waitForEngine();
findLights();
animate();
</script>
</body>
</html>
